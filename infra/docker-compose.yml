services:
  billing-api:
    build:
      context: ../services/billing-api-dotnet
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      ConnectionStrings__BillingDb: ${BILLING_DB_CONNECTION}
      PaymentGateway__ApiKey: ${PAYMENT_GATEWAY_API_KEY}
    depends_on:
      - redis

  notifications:
    build:
      context: ../services/notifications-node
      dockerfile: Dockerfile
    privileged: true
    ports:
      - "3000:3000"
    environment:
      BILLING_API_URL: http://billing-api:8080
      JWT_SECRET: ${JWT_SECRET}
      REDIS_URL: redis://redis:6379
    depends_on:
      - billing-api
      - redis

  redis:
    image: redis:7.4.1-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    expose:
      - "6379"
